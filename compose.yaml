services:
  clean-shore:
    build: .
    image: clean-shore-v25:cpu
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8501}:8501"
    environment:
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
    volumes:
      - shore-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s

volumes:
  shore-data:
